<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-label="National Health Insurance Authority">

  <!-- Circular emblem -->
  <g transform="translate(100,100)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="96" fill="#0a3d1f" stroke="#0a3d1f" stroke-width="2"/>
    <circle cx="0" cy="0" r="88" fill="white" stroke="#0a3d1f" stroke-width="1"/>

    <!-- Curved top text: NATIONAL HEALTH INSURANCE AUTHORITY -->
    <defs>
      <path id="topArc" d="M -80,0 A 80,80 0 0,1 80,0"/>
      <path id="bottomArc" d="M -70,28 A 74,74 0 0,0 70,28"/>
    </defs>

    <text font-family="serif" font-weight="bold" font-size="9.5" fill="#0a3d1f" letter-spacing="1.2">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">NATIONAL HEALTH INSURANCE AUTHORITY</textPath>
    </text>
    <text font-family="serif" font-weight="bold" font-size="7.8" fill="#0a3d1f" letter-spacing="0.8">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">FINANCIAL ACCESS TO HEALTH CARE FOR ALL</textPath>
    </text>

    <!-- Green banner ribbon bottom -->
    <path d="M -52,54 Q -26,66 0,66 Q 26,66 52,54 L 44,62 Q 22,74 0,74 Q -22,74 -44,62 Z" fill="#1a6b32"/>
    <path d="M -54,52 Q -26,64 0,64 Q 26,64 54,52" fill="none" stroke="#1a6b32" stroke-width="10" stroke-linecap="round"/>

    <!-- Shield (Nigerian coat of arms) -->
    <path d="M -18,-30 L 18,-30 L 18,5 Q 0,18 -18,5 Z" fill="#0a0a0a"/>
    <!-- White Y shape on shield -->
    <path d="M 0,-22 L 0,-8 M 0,-8 L -10,5 M 0,-8 L 10,5" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Eagle wings (simplified) -->
    <path d="M -38,-28 Q -28,-40 -14,-32 Q -22,-24 -18,-18" fill="#0a0a0a"/>
    <path d="M  38,-28 Q  28,-40  14,-32 Q  22,-24  18,-18" fill="#0a0a0a"/>
    <!-- Eagle head -->
    <ellipse cx="0" cy="-35" rx="8" ry="7" fill="#0a0a0a"/>
    <!-- Eagle beak -->
    <path d="M 6,-35 L 12,-33 L 7,-31 Z" fill="#c8a000"/>

    <!-- Caduceus staff -->
    <line x1="0" y1="5" x2="0" y2="45" stroke="#1a6b32" stroke-width="2.5"/>
    <!-- Snake wraps -->
    <path d="M -8,12 Q 8,18 -8,26 Q 8,32 -8,40" stroke="#1a6b32" stroke-width="2" fill="none"/>
    <path d="M  8,12 Q -8,18  8,26 Q -8,32  8,40" stroke="#1a6b32" stroke-width="2" fill="none"/>
    <!-- Wings on caduceus -->
    <path d="M -12,8 Q -6,4 0,6" stroke="#1a6b32" stroke-width="2" fill="none"/>
    <path d="M  12,8 Q  6,4 0,6" stroke="#1a6b32" stroke-width="2" fill="none"/>

    <!-- Globe/circle at bottom of caduceus -->
    <circle cx="0" cy="48" r="5" fill="none" stroke="#1a6b32" stroke-width="1.8"/>
    <line x1="-5" y1="48" x2="5" y2="48" stroke="#1a6b32" stroke-width="1"/>
    <line x1="0" y1="43" x2="0" y2="53" stroke="#1a6b32" stroke-width="1"/>

    <!-- Green side ribbons -->
    <path d="M -88,0 Q -78,-8 -68,0 Q -78,8 -88,0 Z" fill="#1a6b32"/>
    <path d="M  88,0 Q  78,-8  68,0 Q  78,8  88,0 Z" fill="#1a6b32"/>
  </g>

  <!-- Text block: NATIONAL HEALTH INSURANCE AUTHORITY -->
  <line x1="214" y1="30" x2="214" y2="170" stroke="#0a3d1f" stroke-width="2.5"/>

  <text x="226" y="68" font-family="'Arial Black', 'Arial Bold', sans-serif" font-weight="900" font-size="34" fill="#0a3d1f" letter-spacing="-0.5">NATIONAL HEALTH</text>
  <text x="226" y="110" font-family="'Arial Black', 'Arial Bold', sans-serif" font-weight="900" font-size="34" fill="#0a3d1f" letter-spacing="-0.5">INSURANCE</text>
  <text x="226" y="152" font-family="'Arial Black', 'Arial Bold', sans-serif" font-weight="900" font-size="34" fill="#0a3d1f" letter-spacing="-0.5">AUTHORITY</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="NHIA">
  <g transform="translate(100,100)">
    <circle cx="0" cy="0" r="96" fill="#0a3d1f"/>
    <circle cx="0" cy="0" r="88" fill="white"/>

    <defs>
      <path id="topArc2" d="M -80,0 A 80,80 0 0,1 80,0"/>
      <path id="botArc2" d="M -70,28 A 74,74 0 0,0 70,28"/>
    </defs>

    <text font-family="serif" font-weight="bold" font-size="9.5" fill="#0a3d1f" letter-spacing="1.2">
      <textPath href="#topArc2" startOffset="50%" text-anchor="middle">NATIONAL HEALTH INSURANCE AUTHORITY</textPath>
    </text>
    <text font-family="serif" font-weight="bold" font-size="7.8" fill="#0a3d1f" letter-spacing="0.8">
      <textPath href="#botArc2" startOffset="50%" text-anchor="middle">FINANCIAL ACCESS TO HEALTH CARE FOR ALL</textPath>
    </text>

    <!-- Green banner ribbon -->
    <path d="M -54,52 Q -26,64 0,64 Q 26,64 54,52" fill="none" stroke="#1a6b32" stroke-width="10" stroke-linecap="round"/>

    <!-- Shield -->
    <path d="M -18,-30 L 18,-30 L 18,5 Q 0,18 -18,5 Z" fill="#0a0a0a"/>
    <path d="M 0,-22 L 0,-8 M 0,-8 L -10,5 M 0,-8 L 10,5" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Eagle wings -->
    <path d="M -38,-28 Q -28,-40 -14,-32 Q -22,-24 -18,-18" fill="#0a0a0a"/>
    <path d="M  38,-28 Q  28,-40  14,-32 Q  22,-24  18,-18" fill="#0a0a0a"/>
    <ellipse cx="0" cy="-35" rx="8" ry="7" fill="#0a0a0a"/>
    <path d="M 6,-35 L 12,-33 L 7,-31 Z" fill="#c8a000"/>

    <!-- Caduceus -->
    <line x1="0" y1="5" x2="0" y2="45" stroke="#1a6b32" stroke-width="2.5"/>
    <path d="M -8,12 Q 8,18 -8,26 Q 8,32 -8,40" stroke="#1a6b32" stroke-width="2" fill="none"/>
    <path d="M  8,12 Q -8,18  8,26 Q -8,32  8,40" stroke="#1a6b32" stroke-width="2" fill="none"/>
    <circle cx="0" cy="48" r="5" fill="none" stroke="#1a6b32" stroke-width="1.8"/>

    <!-- Side ribbons -->
    <path d="M -88,0 Q -78,-8 -68,0 Q -78,8 -88,0 Z" fill="#1a6b32"/>
    <path d="M  88,0 Q  78,-8  68,0 Q  78,8  88,0 Z" fill="#1a6b32"/>
  </g>
</svg>

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clearpass_postgres
    environment:
      POSTGRES_USER: clearpass
      POSTGRES_PASSWORD: clearpass123
      POSTGRES_DB: clearpass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clearpass']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

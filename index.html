<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fb7319" />
    <meta name="format-detection" content="telephone=no" />

    <title>ClearPass — Compliance Management for Nigerian Businesses</title>
    <meta
      name="description"
      content="ClearPass is the compliance platform for Nigerian businesses, MDAs, and partners. Track NHIA, PCC, NSITF, FIRS, BPP, and ITF certificates in one place — verify vendors, prevent procurement gaps, and stay audit-ready."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClearPass — Compliance Management" />
    <meta
      property="og:description"
      content="Track every compliance certificate, get expiry alerts before they hit, and prove procurement readiness on demand."
    />
    <meta property="og:image" content="/icon-512x512.png" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClearPass — Compliance Management" />
    <meta
      name="twitter:description"
      content="Compliance tracking, vendor verification, and procurement-ready scoring for Nigerian businesses."
    />

    <!-- PWA / icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
      /* Prevent rubber-band scroll under fixed mobile bars on iOS. */
      body {
        overscroll-behavior-y: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif">
        <h1>JavaScript Required</h1>
        <p>ClearPass needs JavaScript to run. Please enable it in your browser settings.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
